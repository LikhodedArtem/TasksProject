<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отправка задач</title>
  <link rel="stylesheet" type="text/css" href="css/fourth_page.css">
  <link rel="stylesheet" type="text/css" href="css/fonts.css">
  <link rel="stylesheet" type="text/css" href="css/main_styles.css">
</head>
  <body class="body">
    <header class="header">
      <button class="escape">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Стрелка влево"> <path d="M36 24H14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/> <path d="M22 16L14 24L22 32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="address">
        <div class="address-name">
          <span>ОТ:</span>
        </div>
        <div class="from">
          <div class="address-content">
            <label>Пост</label>
            <span id="post" class="from-content"></span>
          </div>
        </div>
        <div class="from">
          <div class="address-content">
            <label>Механик</label>
            <span id="mechanic" class="from-content"></span>
          </div>
        </div>
        <div class="from">
          <div class="address-content">
            <label>Номер заказ-наряда</label>
            <span id="znNumber" class="from-content"></span>
          </div>
        </div>
        <div class="from">
          <div class="address-content">
            <label>Гос. номер</label>
            <span id="carVin" class="from-content"></span>
          </div>
        </div>
        <div class="address-name">
          <span>КОМУ:</span>
        </div>
        <div class="to">
          <div class="address-content">
            <label id="position"></label>
            <span id="name" class="to-content"></span>
          </div>
        </div>
      </div>
    </header>
    <main class="main">
      <button id="createNew">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
      <div class="tasks-panel">
        <div class="create-new-panel-wrapper">
          <div class="create-new-panel">
          <div class="create-new-panel-head">
            <span class="create-new-panel-name">Создать новую задачу</span>
          </div>
          <div class="create-new-panel-main">
            <textarea class="textarea"></textarea>
            <button class="pin-files">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05 12.25 20.24a6 6 0 1 1-8.49-8.49l9.2-9.19a4 4 0 0 1 5.65 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.48-8.48"/></svg>
            </button>
            <button class="send-task">
              <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Стрелка влево"> <path d="M36 24H14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/> <path d="M22 16L14 24L22 32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        </div>

        <div class="tasks-list">
          <div class="task-wrapper">
            <div class="task">
              <div class="task-head">
                <div>
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </div>
                <div class="task-head-content">
                  <div class="address-name">
                    <span>ОТ:</span>
                  </div>
                  <div class="from">
                    <span class="from-content post">Название поста</span>
                  </div>
                  <div class="from">
                    <span class="from-content mechanic">ФИО механика</span>
                  </div>
                  <div class="from">
                    <span class="from-content zn-number">Номер заказ-наряда</span>
                  </div>
                  <div class="from">
                    <span class="from-content car-vin">Пример номера</span>
                  </div>
                  </div>
                </div>
              <div class="task-value-wrapper">
                <div class="task-value">
                  <div class="task-value-main">
                    <textarea class="textarea" disabled></textarea>
                    <button class="pin-files">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05 12.25 20.24a6 6 0 1 1-8.49-8.49l9.2-9.19a4 4 0 0 1 5.65 5.66l-9.2 9.19a2 2 0 0 1-2.82-2.83l8.48-8.48"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
  <script src="js/main_script.js"></script>
  <script src="js/fourth_page.js"></script>
</html>
